[project]
name = "qlora-finetuning"
version = "0.1.0"
description = "LLM Fine-Tuning Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "datasets>=2.21.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=1.1.0",
    "gradio>=4.44.0",
    "huggingface_hub>=0.23.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.66.0",
    "psutil",
    "gputil",
    "evaluate",
    "rouge_score",
    "nltk",
    "bert-score>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core"]
